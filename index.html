<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f13" />
    <title>VUEBOX</title>
    <meta name="description" content="공식 YouTube 플레이어로 영상을 보고, 시청 기록·재생목록·추천이 모든 기기에서 동기화되는 개인화 영상 플랫폼." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VUEBOX" />
    <meta property="og:title" content="VUEBOX" />
    <meta property="og:description" content="공식 YouTube 플레이어로 영상을 보고, 시청 기록·재생목록·추천이 모든 기기에서 동기화되는 개인화 영상 플랫폼." />
    <script>
      // Apply the cached theme before first paint to avoid a flash. The account setting in
      // Supabase is the source of truth once the user is signed in.
      try {
        var t = localStorage.getItem('vuebox-theme') || 'dark';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
